{% extends 'base.html' %}
{% block title %}Sign Up — Liftr{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-box">
    <div class="auth-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 9l2 3-2 3M22 9l-2 3 2 3"/></svg>
      <span>Liftr</span>
    </div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Start tracking your gains today</p>

    <form method="POST" class="auth-form">
      <div class="field">
        <label class="label">Username</label>
        <input class="input" type="text" name="username" placeholder="johndoe" required autofocus>
      </div>
      <div class="field">
        <label class="label">Email</label>
        <input class="input" type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label class="label">Password</label>
        <input class="input" type="password" name="password" placeholder="Min 6 characters" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
