{% extends 'base.html' %}
{% block title %}{{ 'Edit' if plan else 'New' }} Plan — Liftr{% endblock %}
{% block content %}

<div class="page-header">
  <h1 class="page-title">{{ 'Edit Plan' if plan else 'New Plan' }}</h1>
</div>

<div class="card" style="max-width:520px">
  <form method="POST">
    <div class="field">
      <label class="label">Plan name</label>
      <input class="input" type="text" name="name" placeholder="e.g. Push Day, Pull Day, Legs…"
             value="{{ plan.name if plan else '' }}" required autofocus>
    </div>
    <div class="field">
      <label class="label">Description <span class="label-opt">(optional)</span></label>
      <textarea class="input" name="description" rows="3"
                placeholder="e.g. Chest, shoulders, and triceps">{{ plan.description if plan else '' }}</textarea>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('plans') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">{{ 'Save changes' if plan else 'Create plan' }}</button>
    </div>
  </form>
</div>

{% endblock %}
