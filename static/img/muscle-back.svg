  <g class="m-base" fill="#c7c9cf" stroke="#9a9ca3" stroke-width="1.5">
    <circle cx="100" cy="28" r="18"/>
    <ellipse cx="52" cy="150" rx="9" ry="14"/>
    <ellipse cx="148" cy="150" rx="9" ry="14"/>
    <ellipse cx="80" cy="345" rx="11" ry="7"/>
    <ellipse cx="120" cy="345" rx="11" ry="7"/>
  </g>

  <!-- muscle regions: fill set dynamically via JS -->
  <g class="m-region" fill="#c7c9cf" stroke="#9a9ca3" stroke-width="1.5">
    <rect data-muscle="Neck" x="91" y="44" width="18" height="12" rx="4"/>
    <path data-muscle="Traps" d="M75,50 L125,50 L118,88 L100,96 L82,88 Z"/>
    <circle data-muscle="Shoulders" cx="60" cy="66" r="17"/>
    <circle data-muscle="Shoulders" cx="140" cy="66" r="17"/>
    <path data-muscle="Back" d="M78,90 Q100,84 122,90 L128,160 Q100,172 72,160 Z"/>
    <rect data-muscle="Triceps" x="37" y="72" width="21" height="56" rx="10"/>
    <rect data-muscle="Triceps" x="142" y="72" width="21" height="56" rx="10"/>
    <rect data-muscle="Forearms" x="35" y="130" width="20" height="48" rx="9"/>
    <rect data-muscle="Forearms" x="145" y="130" width="20" height="48" rx="9"/>
    <path data-muscle="Glutes" d="M70,162 Q100,152 130,162 L128,190 Q100,200 72,190 Z"/>
    <rect data-muscle="Abductors" x="58" y="168" width="13" height="26" rx="6"/>
    <rect data-muscle="Abductors" x="129" y="168" width="13" height="26" rx="6"/>
    <rect data-muscle="Hamstrings" x="66" y="192" width="30" height="62" rx="11"/>
    <rect data-muscle="Hamstrings" x="104" y="192" width="30" height="62" rx="11"/>
    <rect data-muscle="Calves" x="70" y="257" width="24" height="80" rx="9"/>
    <rect data-muscle="Calves" x="106" y="257" width="24" height="80" rx="9"/>
